name: Build BlackEra Mod dylib

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Build reason'
        required: false
        default: 'Manual build'

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build dylib for iOS arm64
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        clang -fno-objc-arc \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -dynamiclib \
          -isysroot "$SDK_PATH" \
          -F"$SDK_PATH/System/Library/Frameworks" \
          -install_name @rpath/BlackEra_Mod.dylib \
          -o BlackEra_Mod.dylib \
          "BlackEra_Mod.m" \
          -framework UIKit \
          -framework Foundation \
          -lobjc

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackEra_Mod
        path: BlackEra_Mod.dylib
