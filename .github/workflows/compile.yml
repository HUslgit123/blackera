name: Build BlackEra Mod v3

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile dylib (fixed)
      run: |
        clang -fno-objc-arc \
          -arch arm64 \
          -miphoneos-version-min=13.0 \
          -dynamiclib \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -install_name @rpath/BlackEra_Mod_v3.dylib \
          -o BlackEra_Mod_v3.dylib \
          BlackEra_Mod_v3.m \
          -framework UIKit \
          -framework Foundation

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackEra_Mod_v3
        path: BlackEra_Mod_v3.dylib
